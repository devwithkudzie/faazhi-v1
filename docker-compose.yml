services:
  api:
    build:
      context: ./apps/api
    container_name: faazhi-api
    environment:
      PORT: 4000
      DATA_DIR: /app/data
      UPLOAD_DIR: /app/uploads
      PUBLIC_BASE_URL: http://localhost:4000
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "4000:4000"
    volumes:
      - faazhi_api_data:/app/data
      - faazhi_audio_uploads:/app/uploads
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
    container_name: faazhi-web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  faazhi_api_data:
  faazhi_audio_uploads:
